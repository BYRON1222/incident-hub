# Uso local (Fedora): podman-compose -f devops/docker-compose.yml up -d
services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en tu shell}
      POSTGRES_DB: incidenthub
    ports: ["5432:5432"]
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
