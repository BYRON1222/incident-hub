name: CI (complementario)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incident
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          POSTGRES_DB: incidenthub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U incident" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://incident:${{ secrets.CI_DB_PASSWORD }}@localhost:5432/incidenthub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Aplicar esquema de base de datos
        run: |
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f database/schema.sql
      - run: npm ci
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm test
        working-directory: backend

  dependency-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: ${{ matrix.dir }}
      - run: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.dir }}

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
